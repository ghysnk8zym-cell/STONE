name: Preview smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Cloudflare preview URL to test (e.g. https://<id>-stone.<account>.workers.dev)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --grep @smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
